<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regester</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
    <div class="center">
        {% if msg %}
        <p style="color:red;">{{ msg }}</p>
        {% endif %}
        <h1>Welcome to our website</h1>
        <h3>If already registered Please <a href="/">Login</a></h3>
        <form action="http://localhost:5000/reg" method="post">
            <input class="input" type="text" name="username" placeholder="Enter your username"><br><br>
            <input class="input" type="password" name="password" placeholder="Enter your password"><br><br>
            <input class="input" type="email" name="email" placeholder="Enter your email"><br><br>
            <input class="input" type="text" name="address" placeholder="Enter your address"><br><br>
            <input class="input" type="text" name="city" placeholder="Enter your city"><br><br>
            <input class="input" type="text" name="state" placeholder="Enter your state"><br><br>
            <input class="input" type="text" name="country" placeholder="Enter your country"><br><br>
            <input class="input" type="submit" name="submit">
        </form>
    </div>
</body>
</html>
