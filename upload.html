<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
</head>
<body align="center">
    <form action="http://localhost:5000/up" method="post">
        <h3>Title of the blog:</h3><br>
        <input type="text" name="title" placeholder="Title"><br>
        <h3>Your blog:</h3><br>
        <textarea name="blog" rows="10" cols="50" placeholder="Text"></textarea><br><br>
        <input type="button" value="Clear">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
