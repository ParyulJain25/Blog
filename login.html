<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
    <div class="center">
        {% if msg %}
        <p style="color:red;">{{ msg }}</p>
        {% endif %}
        <h1>Login Here</h1>
        <h3>New here? Click <a href="/register">here</a> to register</h3>
        <form action="http://localhost:5000/login" method="post" align="center">
            <input class="input" type="text" name="username" placeholder="Enter username"><br><br>
            <input class="input" type="password" name="password" placeholder="Enter password"><br><br>
            <input class="input" type="submit" value="submit">
        </form>
    </div>
</body>
</html>
